# /etc/nginx/sites-available/hedge.basecorp.net
# Symlink: ln -s /etc/nginx/sites-available/hedge.basecorp.net /etc/nginx/sites-enabled/

# Upstream servers (Docker containers)
upstream hedge_frontend {
    server 127.0.0.1:3500;
}

upstream hedge_api {
    server 127.0.0.1:8000;
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name hedge.basecorp.net;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name hedge.basecorp.net;

    # SSL certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/hedge.basecorp.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hedge.basecorp.net/privkey.pem;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Basic Auth
    auth_basic "HedgeBot Dashboard";
    auth_basic_user_file /etc/nginx/.htpasswd_hedge;

    # Frontend
    location / {
        proxy_pass http://hedge_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # API
    location /api/ {
        auth_basic off;
        
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://hedge_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # CORS headers
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # Health check (no auth)
    location /health {
        auth_basic off;
        proxy_pass http://hedge_api/health;
    }
}
