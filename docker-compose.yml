version: '3.8'

services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - frontend
      - web_api

  web_api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: always
    command: uvicorn backend.app:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    expose:
      - "8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DB_HOST}:${DB_PORT}/${POSTGRES_DB}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    restart: always
    command: python -m bot.main
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DB_HOST}:${DB_PORT}/${POSTGRES_DB}
      - TRADING_MODE=${TRADING_MODE:-simulation}
      - EXCHANGE_A=${EXCHANGE_A:-binance}
      - EXCHANGE_B=${EXCHANGE_B:-bybit}
      - SYMBOL=${SYMBOL:-BTC/USDT}
      - CONFIG_ID=${CONFIG_ID:-1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - web_api

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    expose:
      - "3000"
    environment:
      - VITE_API_URL=https://${DOMAIN:-localhost}/api
    depends_on:
      - web_api
